<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>currency-converter</title>
    <link rel="stylesheet" href="mystyle.css">
</head>

<body>
    <header>
        <img src="2-removebg-preview.png" alt="logo" class="logo">
    </header>

    <div class="converter-box">
        <div class="tabs">
            <button class="tab-button active">Calculator Transfer</button>

        </div>


        <h2>Transfer Calculator</h2>
        <p>Calculate how much your recipient will receive</p>

        <div class="currency-container">
            <select id="currency-first">
                    <option value="EUR">EUR</option>
                    <option value="USD">USD</option>
                    <option value="INR">INR</option>
                    <option value="ZWL" selected>ZWL</option>
                    <option value="ZAR">ZAR</option>
                    <option value="NGN">NGN</option>
                    <option value="MWK">MWK</option>
                    <option value="KES">KES</option>
                    <option value="GHS">GHS</option>
                    <option value="GBP">GBP</option>
                    <option value="CAD">CAD</option>
                    <option value="AUD">AUD</option>
                    <option value="JPY">JPY</option>
                </select>
            <input type="number" id="worth-first" value="0" min="0">
        </div>

        <div class="currency-container">
            <select id="currency-second">
                    <option value="EUR">EUR</option>
                    <option value="USD">USD</option>
                    <option value="INR" selected>INR</option>
                    <option value="ZWL">ZWL</option>
                    <option value="ZAR">ZAR</option>
                    <option value="NGN">NGN</option>
                    <option value="MWK">MWK</option>
                    <option value="KES">KES</option>
                    <option value="GHS">GHS</option>
                    <option value="GBP">GBP</option>
                    <option value="CAD">CAD</option>
                    <option value="AUD">AUD</option>
                    <option value="JPY">JPY</option>
                </select>
            <input type="number" id="worth-second" disabled>
        </div>

        <p class="exchange-rate" id="exchange-rate"> 1 USD = 138.5802 JPY </p>


    </div>
    <script src="index.js"></script>
</body>

</html>
